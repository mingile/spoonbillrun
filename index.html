<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spoonbill run !!</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <!-- AppleSDGothicNeoEB00: assets/fonts/AppleSDGothicNeoEB00.ttf ??? @font-face ?? -->
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>
    <div id="app" class="app">
      <div class="map-stack">
        <div class="map-shell">
          <div id="map" class="map" role="application" aria-label="??"></div>
          <button
            type="button"
            id="map-reveal-markers"
            class="map-reveal-markers"
          >
            run
          </button>
          <button
            type="button"
            id="map-app-launch"
            class="map-reveal-markers hidden"
            aria-haspopup="dialog"
          >
            App
          </button>
          <button
            type="button"
            id="map-face-toggle"
            class="map-face-toggle"
            aria-pressed="false"
            aria-label="face overlay"
          >
            face
          </button>
          <img
            id="map-face-overlay"
            class="map-face-overlay hidden"
            src="./assets/face.png"
            alt=""
            aria-hidden="true"
          />
        </div>
        <div id="detail" class="detail hidden">
          <button
            type="button"
            id="detail-close"
            class="detail-close"
            aria-label="X"
          >
            X
          </button>
          <div class="detail-inner">
            <div class="detail-photo">
              <img id="detail-img" class="detail-img" alt="" />
            </div>
            <p id="detail-coords" class="detail-coords"></p>
            <p id="detail-caption" class="detail-caption"></p>
            <p id="detail-date" class="detail-date"></p>
          </div>
        </div>
      </div>
      <aside id="panel" class="panel" aria-label="banner">
        <div id="error-banner" class="error-banner hidden" role="alert"></div>
        <header class="banner-bar">
          <h1 class="banner-bar__title">
            <a href="index.html">
              <img
                class="banner-bar__logo"
                src="./assets/banner.png"
                width="372"
                height="60"
                alt="Spoonbill Run"
              />
            </a>
          </h1>
          <ul class="banner-bar__nav">
            <li>
              <a
                class="banner-bar__link banner-bar__link--active"
                href="index.html"
                >Start Running</a
              >
            </li>
            <li><a class="banner-bar__link" href="crew.html">Crew</a></li>
            <li><a class="banner-bar__link" href="works.html">Works</a></li>
            <li><a class="banner-bar__link" href="more.html">More</a></li>
          </ul>
        </header>
        <div id="photo-list-scroller" class="photo-list-scroller">
          <div class="photo-scatter-stage">
            <ul id="photo-list" class="photo-list"></ul>
            <div
              id="photo-scatter-spacer"
              class="photo-scatter-spacer"
              aria-hidden="true"
            ></div>
          </div>
        </div>
      </aside>
    </div>
    <div id="dev-coords" class="dev-coords hidden" aria-live="polite"></div>
    <div
      id="app-phone-viewer"
      class="app-phone-viewer hidden"
      role="dialog"
      aria-modal="true"
      aria-label="App preview"
    >
      <button
        type="button"
        class="app-phone-viewer__backdrop"
        aria-label="Close"
        tabindex="-1"
      ></button>
      <div class="app-phone-viewer__phone" id="app-phone-viewer-stage">
        <img
          id="app-phone-viewer-img"
          class="app-phone-viewer__img"
          alt=""
          draggable="false"
        />
      </div>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
